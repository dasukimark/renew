AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Renew report server. Emails flag reports from renewd to accountability partners through a Gmail account, and emails them when a Mac stops checking in.

Parameters:
  GmailAddress:
    Type: String
    Description: The Gmail account reports are sent from (used only for this).
  AllowedRecipients:
    Type: String
    Default: ""
    Description: Optional comma-separated addresses the server may email. Empty allows any (partners are set in the Renew app).
  TimeZone:
    Type: String
    Default: UTC
    Description: Fallback time zone for times in the emails; reports normally carry the Mac's.
  TokenParameter:
    Type: String
    Default: /renew/report-token
    Description: SSM SecureString parameter holding the token renewd sends.
  SilenceMinutes:
    Type: Number
    Default: 120
    Description: Email the partners when a Mac that's awake hasn't checked in for this many minutes. Renew reports time it wasn't running by itself, so this only catches Renew never coming back.
  StoppingMinutes:
    Type: Number
    Default: 3
    Description: Email the partners when Renew said its service stopped (without a shutdown) and it hasn't checked in for this many minutes.
  QuietCapHours:
    Type: Number
    Default: 168
    Description: Email the partners when a Mac that said it was sleeping or shutting down hasn't checked in for this many hours.
  AppPasswordParameter:
    Type: String
    Default: /renew/gmail-app-password
    Description: SSM SecureString parameter holding the Gmail app password.

Resources:
  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Renaming the function replaces it and changes its URL.
      FunctionName: renew-report-server
      Runtime: python3.13
      Handler: app.handler
      CodeUri: .
      Timeout: 50
      MemorySize: 128
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          ALLOWED_RECIPIENTS: !Ref AllowedRecipients
          GMAIL_ADDRESS: !Ref GmailAddress
          TIME_ZONE: !Ref TimeZone
          TOKEN_PARAM: !Ref TokenParameter
          APP_PASSWORD_PARAM: !Ref AppPasswordParameter
          HEARTBEAT_TABLE: !Ref HeartbeatTable
          SILENCE_MINUTES: !Ref SilenceMinutes
          QUIET_CAP_HOURS: !Ref QuietCapHours
          STOPPING_MINUTES: !Ref StoppingMinutes
      Events:
        CheckIns:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Description: Emails partners about Macs that stopped checking in.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HeartbeatTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TokenParameter}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AppPasswordParameter}"
      FunctionUrlConfig:
        AuthType: NONE

  HeartbeatTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: renew-heartbeats
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: install
          AttributeType: S
      KeySchema:
        - AttributeName: install
          KeyType: HASH

  ReportFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ReportFunction}"
      RetentionInDays: 30

Outputs:
  ReportURL:
    Description: The report server's URL (configure-mac.sh saves it for Renew's installer).
    Value: !GetAtt ReportFunctionUrl.FunctionUrl
